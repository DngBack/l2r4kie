# Cohorts of the r4 confidence run (old repo: artifacts/token-review-winner/cache/cohort_plan.json).
# Reproduces that plan exactly; also the reference for planning cohorts of a new extractor.
# Paths point at the old repository (decision D2: artifacts are not copied).
selection:
  prepared: /home/jovyan/bachdx2/l2r4kie/artifacts/data
  seed: 42
  holdout_percent: 15
  balanced_forms: true
cohorts:
  seed: 107
  train_split: train_reserve   # head-train from the reserve: never in extractor gradients
  train_per_type: 25
  per_type: 6                  # dev and audit
  calibration_per_type: 3
  risk_split: calibration      # risk_validation = calibration documents after the calibration cohort
  risk_per_type: 10
  exclude_forms: [lift-can-cuoc-2024]   # CCCD: no genuinely unseen documents left
